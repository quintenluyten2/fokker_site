title: "Felicaniс Broodfokker — Documentatie"
description: "Verzameling van bewijsmateriaal en documentatie / Collection of evidence and documentation"
url: "https://www.felicanis-fraudeert.be"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

# Plugins (all supported natively by GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "nl"
    values:
      lang: "nl"
      categories: [nl]
  - scope:
      path: "en"
    values:
      lang: "en"
      categories: [en]

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - config.yaml
